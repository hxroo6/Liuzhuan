name: Build

# 自动构建：推送 master 即触发，两端产物上传为 Actions Artifacts
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ===== 电脑端 Windows x64（dotnet publish 自包含）=====
  windows-pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Publish (self-contained x64)
        run: dotnet publish Liuzhuan/Liuzhuan.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: Liuzhuan-Windows-x64
          path: dist/

  # ===== 安卓端 Debug APK =====
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Debug APK
        working-directory: AndroidApp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Liuzhuan-Android-Debug
          path: AndroidApp/app/build/outputs/apk/debug/*.apk
